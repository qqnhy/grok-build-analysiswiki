name: Check analysis wiki

on:
  pull_request:
    paths:
      - 'analysis/**'
      - 'diagrams/**'
      - 'docs-site/**'
      - 'SOURCE_REF'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs-site
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs-site/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build and check links
        run: npm run docs:verify
